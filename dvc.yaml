stages:
  prepare_data:
    cmd: python src/data_loader.py
    deps:
      - src/data_loader.py
      - data/raw
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train_and_evaluate:
    cmd: python src/train_mlflow.py
    deps:
      - src/train_mlflow.py
      - features.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - models/scamshield_pipeline.joblib:
          cache: false
      - models/model_metadata.json:
          cache: false
