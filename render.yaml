services:
  - type: web
    name: faarzi-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash entrypoint.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_URL
        value: http://127.0.0.1:8000
